version: 1
project:
  name: container-template
  description: Ota container mode contract pattern for repeatable setup and verification
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
execution:
  default_context: app
  contexts:
    app:
      backend: container
      lifecycle: persistent
      container:
        image: node:22
tasks:
  setup:
    context: app
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    notes: |
      Example: `ota run setup` to install dependencies inside the container context.
  test:
    context: app
    run: pnpm test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run test` after code changes in the container context.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - node_modules
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.20 sh
      powershell: $env:OTA_VERSION='v1.6.20'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use Ota first for setup, validation, and task execution.
    Treat Ota as the default workflow when the repo runs inside a container.
    Start with `ota doctor`, then `ota validate`, then `ota tasks`.
    Keep container commands explicit and reproducible.
