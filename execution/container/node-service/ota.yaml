version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: node-service-container
  description: Node service template with Ota container mode for setup, dev, and test
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
execution:
  default_context: app
  contexts:
    host:
      backend: native
      requirements:
        toolchains:
          - node
    app:
      backend: container
      lifecycle: persistent
      container:
        image: node:22
      attachments:
        # Same logical path names only conflict when they resolve to the same
        # effective isolation namespace. Distinct container contexts can now
        # coexist truthfully when Ota proves the isolation planes are different.
        isolated_paths:
          - node_modules
tasks:
  setup:
    context: app
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    notes: |
      Example: `ota run setup` to install dependencies inside the container context.
  start:
    execution:
      default_mode: container
      modes:
        native:
          context: host
          env:
            HOSTNAME: 127.0.0.1
            PORT: "3000"
            METRICS_PORT: "9090"
          run: pnpm dev
        container:
          context: app
          lifecycle: persistent
          env:
            HOSTNAME: 0.0.0.0
            PORT: "3000"
            METRICS_PORT: "9090"
          run: pnpm dev
          runtime:
            kind: service
            listeners:
              http:
                protocol: http
                bind:
                  address: 0.0.0.0
                  port:
                    mode: fixed
                    value: 3000
                project:
                  host:
                    address: 127.0.0.1
                    primary: true
                    port:
                      mode: auto
                    path: /
              metrics:
                protocol: http
                bind:
                  address: 0.0.0.0
                  port:
                    mode: fixed
                    value: 9090
                project:
                  host:
                    address: 127.0.0.1
                    port:
                      mode: auto
                    path: /metrics
  clean:start:
    execution:
      default_mode: container
      modes:
        native:
          context: host
          env:
            HOSTNAME: 127.0.0.1
            PORT: "3000"
            METRICS_PORT: "9090"
          run: pnpm dev
        container:
          context: app
          lifecycle: ephemeral
          env:
            HOSTNAME: 0.0.0.0
            PORT: "3000"
            METRICS_PORT: "9090"
          run: pnpm dev
          runtime:
            kind: service
            listeners:
              http:
                protocol: http
                bind:
                  address: 0.0.0.0
                  port:
                    mode: fixed
                    value: 3000
                project:
                  host:
                    address: 127.0.0.1
                    primary: true
                    port:
                      mode: auto
                    path: /
              metrics:
                protocol: http
                bind:
                  address: 0.0.0.0
                  port:
                    mode: fixed
                    value: 9090
                project:
                  host:
                    address: 127.0.0.1
                    port:
                      mode: auto
                    path: /metrics
    notes: |
      Example: `ota run start` while iterating in the container context.
      Use `ota run start --mode native` to run the same task intent on the host.
      Use `ota run clean:start` when you want an ephemeral container lifecycle.
      Ota injects `OTA_PUBLIC_URL` before the process starts and prints the same URL after startup.
  test:
    context: app
    command:
      exe: pnpm
      args:
        - test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run test` before merging from the container context.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - start
    - clean:start
    - test
  verify_after_changes:
    - test
  writable_paths:
    - node_modules
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Use Ota first for setup, validation, and task execution.
    Treat Ota as the default workflow when the repo runs inside a container.
    Start with `ota doctor`, then `ota validate`, then `ota tasks`.
    Keep container commands explicit and reproducible.
