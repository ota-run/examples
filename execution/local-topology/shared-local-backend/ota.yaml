version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: shared-local-backend
  description: Advanced shared local backend example with one producer service and one co-located helper app intentionally reusing one container boundary
execution:
  default_context: app
  contexts:
    app:
      backend: container
      lifecycle: persistent
      container:
        image: node:24-bookworm
      requirements:
        runtimes:
          node: ">=24"
        tools:
          pnpm: "*"
  shared_backends:
    workbench:
      scope: local
      backend: container
      lifecycle: persistent
      context: app
tasks:
  dev:
    description: Start the API service inside the shared workbench backend
    run: pnpm dev:api
    runtime:
      kind: service
      backend_binding: workbench
      listeners:
        http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 8080
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 8080
              path: /
    notes: |
      Example: `ota run dev`
      This task is the producer service inside the shared local backend family.
  sandbox:
    description: Start a co-located helper app that targets the producer through the internal plane by default
    inputs:
      base_url:
        description: Override the API base URL when sandbox should point somewhere other than the repo-managed producer
    run: pnpm dev:sandbox
    runtime:
      kind: service
      backend_binding: workbench
      listeners:
        web:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 3000
              path: /
    targets:
      api:
        service:
          task: dev
          listener: http
          address_view: internal
        override_input: base_url
    notes: |
      Example: `ota run sandbox`
      Because `sandbox` and `dev` share one declared backend boundary, ota can resolve `address_view: internal` truthfully to the producer bind endpoint instead of guessing a host bridge.
agent:
  entrypoint: dev
  default_task: sandbox
  safe_tasks:
    - dev
    - sandbox
  verify_after_changes:
    - sandbox
  writable_paths:
    - src
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Start with `ota doctor`, then `ota validate`, then run `ota run dev` or `ota run sandbox`.
    Keep bound task shapes deterministic; shared local backends are explicit identity, not a way to ignore conflicting container shape.
