version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: ssh-node-service
  description: Node service template with Ota remote execution mode for setup, dev, and test
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
execution:
  default_context: app
  contexts:
    app:
      backend: remote
      lifecycle: persistent
      remote:
        provider: ssh
        target: user@remote-host
        cwd: /workspace
tasks:
  setup:
    context: app
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    notes: |
      Example: `ota run setup` to prepare dependencies on the remote context.
  dev:
    context: app
    run: pnpm dev
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run dev` while iterating on the remote context.
  test:
    context: app
    command:
      exe: pnpm
      args:
        - test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run test` before merging from the remote context.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - dev
    - test
  verify_after_changes:
    - test
  writable_paths:
    - node_modules
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Use Ota first for setup, validation, and task execution.
    Treat Ota as the default workflow when the repo runs on a remote target.
    Start with `ota doctor`, then `ota validate`, then `ota tasks`.
    Keep remote commands explicit and reproducible.
