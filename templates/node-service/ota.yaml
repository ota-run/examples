version: 1
project:
  name: node-service
  description: Real Node service template with explicit prepare, setup, runtime proof, and agent boundaries
  type: application
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
env:
  vars:
    APP_ENV:
      default: local
      allowed:
        - local
        - ci
    PATH:
      prepend:
        - ./node_modules/.bin
  sources:
    - kind: dotenv
      path: .env.local
surfaces:
  app:
    kind: http
    label: Local App
    purpose: Browser-facing service surface for the local Node workflow
    visibility: public
    port: 3000
    path: /
    readiness:
      kind: http
      path: /health
      timeout: 5s
tasks:
  setup:env:local:
    internal: true
    description: Create a local env overlay from the committed template when needed
    action:
      kind: copy_if_missing
      from: .env.example
      to: .env.local
  setup:
    description: Hydrate Node dependencies through the declared pnpm lane
    depends_on:
      - setup:env:local
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
  dev:
    description: Start the local development server
    env:
      APP_ENV: local
    launch:
      kind: command
      exe: pnpm
      args:
        - dev
        - --host
        - 127.0.0.1
        - --port
        - "3000"
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    runtime:
      kind: service
      surfaces:
        - app
    notes: |
      Use this when you are iterating locally and want one declared service surface that Ota can prove.
  test:
    description: Run the verification suite
    run: pnpm test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Run this after code changes.
  verify:
    description: Run the canonical verification entrypoint
    aggregate:
      tasks:
        - test
    safe_for_agent: true
    notes: |
      Use this when you want one named verification surface without a fake no-op shell body.
workflows:
  default: app
  app:
    intent: local_development
    description: Canonical Node service front door with explicit prepare, setup, and run phases
    prepare:
      task: setup:env:local
    setup:
      task: setup
    run:
      task: dev
    readiness:
      surfaces:
        - app
    exposes:
      - surface: app
    notes: |
      Use this when you want Ota to create local env state, prepare dependencies, and prove the service URL.
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: verify
  safe_tasks:
    - setup
    - test
    - verify
  verify_after_changes:
    - verify
  writable_paths:
    - node_modules
    - .pnpm-store
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.20 sh
      powershell: $env:OTA_VERSION='v1.6.20'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way pnpm is the default package workflow in a Node service.
    Start with `ota doctor`, then `ota validate`, then `ota up --dry-run`, then `ota run test`.
    Use `ota workflows` to see the main front door and `ota proof runtime --workflow app` to prove it.
