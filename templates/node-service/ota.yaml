version: 1
project:
  name: node-service
  description: Real Node service template with explicit setup, test, and agent boundaries
runtimes:
  node: "22"
tools:
  pnpm:
    version: "10"
    acquisition:
      provider: corepack
      package: pnpm
      version: "10.0.0"
tasks:
  setup:
    run: pnpm install
    requirements:
      tools:
        pnpm: "10"
  dev:
    run: pnpm dev
    depends_on:
      - setup
    requirements:
      tools:
        pnpm: "10"
    notes: |
      Use this when you are iterating locally.
  test:
    run: pnpm test
    depends_on:
      - setup
    requirements:
      tools:
        pnpm: "10"
    notes: |
      Run this after code changes.
workflows:
  default: app
  app:
    setup:
      task: setup
    run:
      task: dev
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | sh
      powershell: irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way pnpm is the default package workflow in a Node service.
    Start with `ota doctor`, then `ota validate`, then `ota up --dry-run`, then `ota run test`.
    Use `ota workflows` to see the main front door and `ota proof runtime --workflow app` to prove it.
