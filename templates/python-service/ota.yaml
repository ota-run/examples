version: 1
project:
  name: python-service
  description: Real Python service template with explicit setup, test, and lint boundaries
runtimes:
  python: "3.12"
tools:
  uv:
    version: "0.6"
    acquisition:
      provider: command
      shell: sh
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
tasks:
  setup:
    run: uv sync
    requirements:
      tools:
        uv: "0.6"
  test:
    run: uv run pytest
    depends_on:
      - setup
    requirements:
      tools:
        uv: "0.6"
    notes: |
      Run this after code changes.
  lint:
    run: uv run ruff check .
    depends_on:
      - setup
    requirements:
      tools:
        uv: "0.6"
    notes: |
      Use this when you touch application code.
workflows:
  default: app
  app:
    setup:
      task: setup
checks:
  - name: python-installed
    kind: precondition
    severity: error
    run: python --version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
    - lint
  verify_after_changes:
    - test
  writable_paths:
    - app
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | sh
      powershell: irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way uv is the default package workflow in a Python service.
    Start with `ota doctor`, then `ota validate`, then `ota up --dry-run`, then `ota run test`.
    Use `ota workflows` to inspect the main setup lane and `ota up` to apply the selected uv acquisition path.
