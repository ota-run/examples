version: 1
project:
  name: python-service
  description: Real Python service template with explicit setup, test, and lint boundaries
toolchains:
  python:
    version: "3.12"
    package_managers:
      uv: "0.6"
    fulfillment:
      source: uv
      mode: run
tasks:
  setup:
    description: Hydrate Python dependencies through the declared uv lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: uv
        cwd: .
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv
      network: true
      network_kind: dependency_hydration
  test:
    command:
      exe: uv
      args:
        - run
        - pytest
    depends_on:
      - setup
    requirements:
      toolchains:
        - python
    notes: |
      Run this after code changes.
  lint:
    command:
      exe: uv
      args:
        - run
        - ruff
        - check
        - .
    depends_on:
      - setup
    requirements:
      toolchains:
        - python
    notes: |
      Use this when you touch application code.
workflows:
  default: app
  app:
    setup:
      task: setup
checks:
  - name: python-installed
    kind: precondition
    severity: error
    run: python --version
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
    - lint
  verify_after_changes:
    - test
  writable_paths:
    - .venv
    - app
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.20 sh
      powershell: $env:OTA_VERSION='v1.6.20'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way uv is the default package workflow in a Python service.
    Start with `ota doctor`, then `ota validate`, then `ota up --dry-run`, then `ota run test`.
    Use `ota workflows` to inspect the main setup lane and `ota up` to apply the selected uv acquisition path.
