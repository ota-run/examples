version: 1
project:
  name: node-corepack-toolchain-flow
  description: Focused example for a check-only Node toolchain that also owns Corepack package-manager activation
  type: application
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    description: Install package-manager dependencies with one explicit Node owner
    category: setup
    run: pnpm install
    requirements:
      toolchains:
        - node
    notes: |
      `toolchains.node` owns the Node runtime, `node` executable, and declared Corepack package
      managers.
  test:
    description: Run the verification suite
    category: test
    run: pnpm test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
workflows:
  default: app
  app:
    intent: local_development
    description: Node front door with a managed Node runtime and declared Corepack package-manager activation
    setup:
      task: setup
    run:
      task: test
    notes: |
      The point of this example is that `toolchains.node` owns the runtime, `node` executable,
      and declared Corepack package-manager activation in one place.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota doctor` and `ota up --dry-run` to inspect the Node toolchain boundary before editing.
