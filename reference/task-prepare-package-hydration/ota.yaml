version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: task-prepare-package-hydration
  description: Canonical first-class package hydration through node and Python package managers
  type: service

toolchains:
  node:
    version: "24.15.0"
    package_managers:
      yarn: "4.11.0"
    fulfillment:
      source: corepack
      mode: run
  python:
    version: "3.12.11"
    package_managers:
      poetry: "2.1.4"
    fulfillment:
      source: uv
      mode: run

tasks:
  install:
    description: Hydrate workspace dependencies through the declared Yarn install lane
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: yarn
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .yarn/install-state.gz
      network: true
      network_kind: dependency_hydration

  install:python:
    description: Hydrate Python dependencies through the declared Poetry install lane
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: poetry
        cwd: .
        groups:
          - dev
          - test
        group_mode: with
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv
      network: true
      network_kind: dependency_hydration

  build:
    description: Build after dependency hydration
    category: build
    run: yarn build
    depends_on:
      - install
      - install:python
    requirements:
      toolchains:
        - node
