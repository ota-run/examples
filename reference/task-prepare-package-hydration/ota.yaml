version: 1
project:
  name: task-prepare-package-hydration
  description: Canonical first-class package hydration through a node package manager
  type: service

toolchains:
  node:
    version: "24.15.0"
    package_managers:
      yarn: "4.11.0"
    fulfillment:
      source: corepack
      mode: run

tasks:
  install:
    description: Hydrate workspace dependencies through the declared Yarn install lane
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: yarn
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .yarn/install-state.gz
      network: true
      network_kind: dependency_hydration

  build:
    description: Build after dependency hydration
    category: build
    run: yarn build
    depends_on:
      - install
    requirements:
      toolchains:
        - node
