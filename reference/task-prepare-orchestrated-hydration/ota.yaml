version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: task-prepare-orchestrated-hydration
  description: Command-backed dependency hydration mediated by a declared devbox orchestrator
  type: application

toolchains:
  node:
    version: "*"
    package_managers:
      pnpm: "*"

orchestrators:
  devbox:
    kind: devbox
    required: true
    config_files:
      - devbox.json
    prepare:
      install: true

tasks:
  setup:
    description: Hydrate Node dependencies through pnpm inside the declared devbox environment
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    execution:
      orchestrator:
        ref: devbox
        mode: exec

  test:
    description: Run tests through the same devbox-mediated environment
    category: test
    command:
      exe: pnpm
      args:
        - test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    execution:
      orchestrator:
        ref: devbox
        mode: exec
