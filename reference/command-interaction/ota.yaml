version: 1

project:
  name: command-interaction-reference
  description: Human-only browser OAuth task with an explicit terminal requirement

tools:
  wrangler:
    version: "*"
    required: false

tasks:
  cloudflare:login:
    description: Authenticate a human operator through Wrangler OAuth
    command:
      exe: wrangler
      args: [login]
      interaction: required
    requirements:
      tools:
        wrangler: "*"
    safe_for_agent: false

agent:
  safe_tasks: []
