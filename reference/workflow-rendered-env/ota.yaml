version: 1
project:
  name: workflow-rendered-env
  description: Canonical workflow-owned compose env-file example rendered from repo template truth plus selected env overlays
  type: application

toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run

execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"

env:
  vars:
    DATABASE_URL:
      required: true
  profiles:
    compose:
      sources:
        - kind: dotenv
          path: .env.local
      env:
        REDIS_HOST: redis
      render:
        dotenv:
          path: .env.compose
          template: .env.example
          include:
            - DATABASE_URL

services:
  api:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: api
  postgres:
    manager:
      kind: compose
      name: local
      file: docker-compose.yml
      service: postgres

tasks:
  setup:
    description: Hydrate dependencies before running the dev server
    category: setup
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration

  dev:
    description: Start the app using the workflow-owned compose env truth
    category: dev
    launch:
      kind: command
      exe: pnpm
      args:
        - dev
    depends_on:
      - setup
    requires_services:
      - api
      - postgres
    requirements:
      env:
        - DATABASE_URL
      toolchains:
        - node

workflows:
  default: compose-dev
  compose-dev:
    intent: local_development
    description: Render `.env.compose` from `.env.example` plus selected workflow env truth, then start the service-backed dev path
    env:
      profile: compose
      compose_env_file_services:
        - api
        - postgres
    setup:
      task: setup
    run:
      task: dev
