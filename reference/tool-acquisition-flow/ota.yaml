version: 1
project:
  name: tool-acquisition-flow
  description: Focused example for workflow-scoped tool acquisition through Corepack and command activation
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
  python:
    version: "3.12"
    provider: uv
    package_managers:
      uv: "0.6"
tasks:
  setup:web:
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
    notes: |
      Use this when the Node front door is the path you want to prepare.
      The selected acquisition lane is Corepack-managed pnpm.
  test:web:
    run: pnpm test
    depends_on:
      - setup:web
    requirements:
      toolchains:
        - node
    notes: |
      Use this as the Node verification path after setup.
  setup:python:
    run: uv sync
    requirements:
      toolchains:
        - python
    notes: |
      Use this when the Python front door is the path you want to prepare.
      The selected acquisition lane is the uv-backed Python toolchain.
  lint:python:
    run: uv run ruff check .
    depends_on:
      - setup:python
    requirements:
      toolchains:
        - python
    notes: |
      Use this as the Python verification path after setup.
workflows:
  default: web
  web:
    intent: local_development
    description: Node workflow that selects only the Corepack-managed pnpm acquisition lane
    setup:
      task: setup:web
    run:
      task: test:web
  python:
    intent: local_development
    description: Python workflow that selects only the uv-backed Python toolchain lane
    setup:
      task: setup:python
    run:
      task: lint:python
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
  - name: python-installed
    kind: precondition
    severity: error
    run: python --version
agent:
  entrypoint: setup:web
  default_task: test:web
  safe_tasks:
    - setup:web
    - test:web
    - setup:python
    - lint:python
  verify_after_changes:
    - test:web
    - lint:python
  writable_paths:
    - node_modules
    - .pnpm-store
    - app
    - packages
    - src
    - tests
    - scripts
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota workflows` first to choose the front door you actually want.
    Start with `ota doctor`, then `ota up --dry-run --workflow web` or `ota up --dry-run --workflow python`.
    The point of this example is that only the selected workflow's acquisition lane should appear.
