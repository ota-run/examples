version: 1
project:
  name: podman-compose-adapter-inputs
  description: Focused example for Podman compose adapter ownership
  type: application

execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          podman: "*"

env:
  vars:
    DATABASE_URL:
      required: true
  profiles:
    runtime:
      sources:
        - kind: dotenv
          path: .env.local
      env:
        REDIS_HOST: redis
      render:
        dotenv:
          path: .env.compose
          template: .env.example
          include:
            - DATABASE_URL

services:
  api:
    manager:
      kind: compose
      engine: podman
      name: local
      file: compose/compose.yml
      service: api
  postgres:
    manager:
      kind: compose
      engine: podman
      name: local
      file: compose/compose.yml
      service: postgres

tasks:
  compose:up:
    context: host
    description: Start the Podman compose stack with task-owned adapter truth
    adapter_inputs:
      compose:
        cwd: compose
        env_files:
          - compose/.env.task
    launch:
      kind: command
      exe: podman
      args:
        - compose
        - up
    requirements:
      tools:
        podman: "*"

  compose:down:
    context: host
    description: Stop the Podman compose stack with task-owned file and profile truth
    adapter_inputs:
      compose:
        cwd: compose
        env_files:
          - compose/.env.task
        files:
          - compose/compose.yml
        profiles:
          - app
    command:
      exe: podman
      args:
        - compose
        - down
    requirements:
      tools:
        podman: "*"

  compose:workflow:up:
    context: host
    description: Start the Podman compose stack with workflow-owned adapter root and overlays
    launch:
      kind: command
      exe: podman
      args:
        - compose
        - up
    requirements:
      tools:
        podman: "*"

workflows:
  default: runtime
  runtime:
    intent: packaged_runtime
    description: Render workflow-owned dotenv truth and prepend Podman compose overlays into the selected compose task path
    adapter_inputs:
      compose:
        cwd: compose
        files:
          - compose/compose.override.yml
        profiles:
          - runtime
        project_name: podman-compose-adapter-inputs
    env:
      profile: runtime
      compose_env_file_services:
        - api
        - postgres
    run:
      task: compose:workflow:up

metadata:
  ota:
    minimum_version: "1.6.21"
