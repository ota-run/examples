version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: compose-adapter-inputs
  description: Canonical compose adapter ownership reference for workflow-owned overlays plus task-owned compose inputs
  type: application

execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"

env:
  vars:
    DATABASE_URL:
      required: true
  profiles:
    runtime:
      sources:
        - kind: dotenv
          path: .env.local
      env:
        REDIS_HOST: redis
      render:
        dotenv:
          path: .env.compose
          template: .env.example
          include:
            - DATABASE_URL
surfaces:
  api:
    kind: http
    port: 3000
    path: /

services:
  api:
    manager:
      kind: compose
      name: local
      files:
        - docker/docker-compose.yml
      env_files:
        - .env.compose
      service: api
  postgres:
    manager:
      kind: compose
      name: local
      files:
        - docker/docker-compose.yml
      env_files:
        - .env.compose
      service: postgres

tasks:
  compose:staged:up:
    description: Start a finite staged Compose service group through first-class compose ownership
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
        profiles:
          - runtime
    compose:
      kind: up
      detach: true
      services:
        - postgres
        - api
    requirements:
      tools:
        docker: "*"

  compose:build:
    description: Build selected Compose services through first-class compose ownership
    category: build
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    compose:
      kind: build
      services:
        - api
    requirements:
      tools:
        docker: "*"

  compose:up:
    description: Start the Compose stack with task-owned env-file, file-stack, and profile truth
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        env_files:
          - docker/.env.task
    launch:
      kind: compose
      action: up
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

  compose:native:published:
    description: Start one native Docker Compose service with task-owned publication truth so ota can remap the published host port per run
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    compose:
      kind: up
      detach: true
      services:
        - published
    runtime:
      kind: service
      listeners:
        http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 3000
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 3000
              path: /
            publication:
              compose:
                service: published
    requirements:
      tools:
        docker: "*"

  compose:down:
    description: Stop the Compose stack with task-owned Compose file and profile truth
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        env_files:
          - docker/.env.task
        files:
          - docker/docker-compose.yml
        profiles:
          - app
    compose:
      kind: down
      remove_volumes: true
      timeout_seconds: 2
    requirements:
      tools:
        docker: "*"

  compose:ps:
    description: Inspect selected Compose services through first-class Compose ownership
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    compose:
      kind: ps
      services:
        - api
    requirements:
      tools:
        docker: "*"

  compose:debug:up:
    description: Start a debug lane with task-owned Compose project naming
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        env_files:
          - docker/.env.task
        files:
          - docker/docker-compose.yml
        profiles:
          - debug
        project_name: compose-adapter-inputs-debug
    launch:
      kind: compose
      action: up
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

  compose:linux:up:
    description: Start one shared Compose lane with a Linux-only adapter overlay
    category: dev
    context: host
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker/docker-compose.yml
          project_name: compose-adapter-inputs
    launch:
      kind: compose
      action: up
      services:
        - api
    variants:
      - when:
          os: linux
        env:
          CURRENT_UID: ${OTA_HOST_UID}:${OTA_HOST_GID}
        adapter_inputs:
          overlays:
            compose:
              env_files:
                - docker/.env.linux
              files:
                - docker/docker-compose.linux.yml
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

  compose:exec:command:
    description: Run a direct argv command inside the api service through first-class compose execution
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    compose:
      kind: exec
      service: api
      workdir: /workspace
      exe: npm
      args:
        - run
        - lint
    requirements:
      tools:
        docker: "*"

  compose:setup:deps:
    description: Hydrate volume-backed app dependencies through a declared Compose service while keeping npm truth typed and the host prerequisite on Docker
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: app
        manager: npm
        mode: ci
        compose:
          kind: run
          service: api
          workdir: /workspace
    requirements:
      tools:
        docker: "*"
    effects:
      adapter_state:
        - compose_volume:node_modules
      network: true
      network_kind: dependency_hydration

  compose:workflow:up:
    description: Start the Compose stack with workflow-owned adapter root and overlays
    category: dev
    context: host
    launch:
      kind: compose
      action: up
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

workflows:
  default: runtime
  runtime:
    intent: packaged_runtime
    description: Render workflow-owned dotenv truth and project compose overlays into the selected compose task path
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.override.yml
        profiles:
          - runtime
        project_name: compose-adapter-inputs
    env:
      profile: runtime
      compose_env_file_services:
        - api
        - postgres
    run:
      task: compose:workflow:up
