version: 1
project:
  name: compose-adapter-inputs
  description: Canonical compose adapter ownership reference for workflow-owned overlays plus task-owned compose inputs
  type: application

execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"

env:
  vars:
    DATABASE_URL:
      required: true
  profiles:
    runtime:
      sources:
        - kind: dotenv
          path: .env.local
      env:
        REDIS_HOST: redis
      render:
        dotenv:
          path: .env.compose
          template: .env.example
          include:
            - DATABASE_URL
surfaces:
  api:
    kind: http
    port: 3000
    path: /

services:
  api:
    manager:
      kind: compose
      name: local
      file: docker/docker-compose.yml
      service: api
  postgres:
    manager:
      kind: compose
      name: local
      file: docker/docker-compose.yml
      service: postgres

tasks:
  compose:staged:up:
    description: Start a finite staged Compose service group through first-class compose ownership
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
        profiles:
          - runtime
    compose:
      kind: up
      detach: true
      services:
        - postgres
        - api
    requirements:
      tools:
        docker: "*"

  compose:build:
    description: Build selected Compose services through first-class compose ownership
    category: build
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    compose:
      kind: build
      services:
        - api
    requirements:
      tools:
        docker: "*"

  compose:up:
    description: Start the Compose stack with task-owned env-file, file-stack, and profile truth
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        env_files:
          - docker/.env.task
    launch:
      kind: compose
      action: up
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

  compose:down:
    description: Stop the Compose stack with task-owned Compose file and profile truth
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        env_files:
          - docker/.env.task
        files:
          - docker/docker-compose.yml
        profiles:
          - app
    compose:
      kind: down
      remove_volumes: true
    requirements:
      tools:
        docker: "*"

  compose:debug:up:
    description: Start a debug lane with task-owned Compose project naming
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        env_files:
          - docker/.env.task
        files:
          - docker/docker-compose.yml
        profiles:
          - debug
        project_name: compose-adapter-inputs-debug
    launch:
      kind: compose
      action: up
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

  compose:exec:command:
    description: Run a direct argv command inside the api service through first-class compose execution
    category: dev
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    compose:
      kind: exec
      service: api
      workdir: /workspace
      exe: npm
      args:
        - run
        - lint
    requirements:
      tools:
        docker: "*"

  compose:setup:deps:
    description: Hydrate app dependencies through a declared Compose service while keeping npm truth typed and the host prerequisite on Docker
    category: setup
    context: host
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: app
        manager: npm
        mode: ci
        compose:
          kind: run
          service: api
          workdir: /workspace
    requirements:
      tools:
        docker: "*"
    effects:
      writes:
        - app/node_modules
      network: true
      network_kind: dependency_hydration

  compose:workflow:up:
    description: Start the Compose stack with workflow-owned adapter root and overlays
    category: dev
    context: host
    launch:
      kind: compose
      action: up
    runtime:
      kind: service
      surfaces:
        - api
    requirements:
      tools:
        docker: "*"

workflows:
  default: runtime
  runtime:
    intent: packaged_runtime
    description: Render workflow-owned dotenv truth and project compose overlays into the selected compose task path
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.override.yml
        profiles:
          - runtime
        project_name: compose-adapter-inputs
    env:
      profile: runtime
      compose_env_file_services:
        - api
        - postgres
    run:
      task: compose:workflow:up
