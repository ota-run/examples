services:
  api:
    image: nginx:1.29-alpine
    ports:
      - "3000:80"
    depends_on:
      - postgres

  published:
    image: python:3.12-alpine
    command:
      - python
      - -m
      - http.server
      - "3000"
    ports:
      - "3000:3000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compose_adapter_inputs
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota
