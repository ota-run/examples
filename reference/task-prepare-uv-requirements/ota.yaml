version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: task-prepare-uv-requirements
  description: Canonical Python setup using ensure_virtualenv plus uv pip requirements hydration
  type: application

toolchains:
  python:
    version: "3.12.11"
    package_managers:
      uv: ">=0.7.0"

tasks:
  setup:venv:
    description: Materialize the local Python virtualenv deterministically
    category: setup
    action:
      kind: ensure_virtualenv
      path: .venv
      python: "3.12"
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv

  setup:
    description: Hydrate Python dependencies from requirements.txt through uv
    category: setup
    depends_on:
      - setup:venv
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: uv
        cwd: .
        mode: pip_requirements
        requirements_file: requirements.txt
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .venv
      network: true
      network_kind: dependency_hydration

  test:
    description: Run the Python test suite
    category: verify
    command:
      exe: uv
      args:
        - run
        - pytest
    depends_on:
      - setup
    requirements:
      toolchains:
        - python
