version: 1
metadata:
  ota:
    minimum_version: "1.6.27"

project:
  name: typed-effect-schema-mutation
  description: Execution-disabled V12 typed PostgreSQL schema-mutation plan reference

resource_bindings:
  production_primary:
    kind: database
    provider: postgresql
    namespace:
      authority: dns:example.org
      organization: example
      tenant: platform
      environment: production
      account: primary

effect_definitions:
  production_schema_migration:
    kind: database_schema_mutation
    action: apply_migration_set
    resource:
      engine: postgresql
      target_ref: production_primary
      schema: public
    bounds:
      migration_set:
        root: migrations
        content_identity: sha256:f6f991588b53ed1a90f5dd87eba5538929bb66465486397dd462b8152d1971d9
      start_state: any_within_set

tasks:
  db:migrate:
    description: Derive the exact reviewed production migration plan without provider execution
    action:
      kind: database_schema_mutation
      effect: production_schema_migration
    effects:
      declared:
        - production_schema_migration
      network: true
      network_kind: integration_test
      external_state:
        - postgres

agent:
  default_task: db:migrate
  safe_tasks: []
  verify_after_changes: []
  writable_paths:
    - migrations
  protected_paths:
    - ota.yaml
