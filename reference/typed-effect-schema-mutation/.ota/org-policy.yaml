policies:
  effects:
    mode: compatibility
    typed:
      rules:
        - id: deny_production_schema_mutation
          selector:
            kind: database_schema_mutation
            actions:
              - apply_migration_set
              - reset_schema
              - rollback_migration_set
            resource:
              match: exact
              engine: postgresql
              namespace:
                authority: dns:example.org
                organization: example
                tenant: platform
                environment: production
                account: primary
              schema: public
          decision: deny
