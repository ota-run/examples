version: 1
project:
  name: java-sdkman-toolchain-flow
  description: Focused example for a check-only Java toolchain that keeps Maven standalone
  type: application
toolchains:
  java:
    version: "21"
    fulfillment:
      source: sdkman
      mode: run
tools:
  maven: "*"
tasks:
  build:
    description: Compile and package through one Java owner plus standalone Maven
    category: build
    run: mvn package
    requirements:
      toolchains:
        - java
      tools:
        maven: "*"
    notes: |
      `toolchains.java` owns `java` and `javac`.
      Maven stays standalone because the Java toolchain does not own it in v1.
  test:
    description: Run the Maven verification suite
    category: test
    run: mvn test
    depends_on:
      - build
    requirements:
      toolchains:
        - java
      tools:
        maven: "*"
workflows:
  default: app
  app:
    intent: local_development
    description: Java front door with SDKMAN-backed toolchain ownership and standalone Maven
    run:
      task: test
    notes: |
      The point of this example is that `toolchains.java` owns Java while Maven stays explicitly
      outside that owner.
agent:
  entrypoint: build
  default_task: test
  safe_tasks:
    - build
    - test
  verify_after_changes:
    - test
  writable_paths:
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  notes: |
    Use `ota doctor` and `ota up --dry-run` to inspect the Java toolchain boundary before editing.
