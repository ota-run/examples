version: 1
project:
  name: action-ensure-bundle
  description: Canonical bundled deterministic host bootstrap reference using action.kind ensure_bundle
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native

tasks:
  bootstrap:local:
    description: Prepare the local repo state through one ordered bundle of deterministic file mutations
    category: setup
    context: host
    action:
      kind: ensure_bundle
      steps:
        - kind: copy_if_missing
          from: .env.example
          to: .env.local
        - kind: ensure_env_file
          path: .env.local
          vars:
            APP_ENV:
              value: local
              mode: replace
            API_TOKEN:
              random:
                bytes: 24
                encoding: hex
        - kind: ensure_directory
          path: .cache/ota
        - kind: ensure_file
          path: .secrets/dev-token
          random:
            bytes: 24
            encoding: hex

workflows:
  default: local-bootstrap
  local-bootstrap:
    intent: local_development
    description: Use one finite workflow prepare lane when repo bootstrap needs more than one deterministic host mutation
    prepare:
      task: bootstrap:local
