version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: task-tool-bootstrap-cypress
  description: Canonical Cypress browser bootstrap through first-class tool bootstrap
toolchains:
  node:
    version: "^20.20.2"
    package_managers:
      pnpm: "10.26.0"
tasks:
  setup:browsers:
    description: Install Cypress browsers through the repo package manager
    prepare:
      kind: tool_bootstrap
      tool: cypress_browsers
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
    requirements:
      toolchains:
        - node
    effects:
      network: true
      network_kind: tool_bootstrap
