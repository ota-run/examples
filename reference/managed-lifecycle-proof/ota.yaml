version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: managed-lifecycle-proof
  description: Bounded Compose lifecycle transition proof with runner-owned cleanup.
services:
  database:
    manager:
      kind: compose
      name: managed-lifecycle-proof
      file: compose.yaml
      service: database
    lifecycle:
      teardown_assertion: manager_inactive
tasks:
  build:
    command:
      exe: sh
      args: ["-lc", "echo build"]
  assert-database:
    command:
      exe: sh
      args: ["-lc", "echo database-ready"]
    requires_services: [database]
workflows:
  default: smoke
  smoke:
    run:
      task: build
    proof:
      lifecycle:
        services: [database]
        assertion:
          task: assert-database
