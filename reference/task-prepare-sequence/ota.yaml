version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: task-prepare-sequence
  description: Canonical ordered mixed setup through first-class prepare sequencing
toolchains:
  python:
    version: "3.12"
    package_managers:
      poetry: ">=2.3.4,<2.4.0"
tasks:
  setup:
    description: Materialize local env and bootstrap Playwright browsers through one setup lane
    prepare:
      kind: sequence
      steps:
        - kind: ensure_env_file
          path: .env.local
          vars:
            APP_ENV:
              value: local
        - kind: tool_bootstrap
          tool: playwright_browsers
          browsers:
            - chromium
          with_deps: true
          source:
            kind: poetry
            cwd: .
    requirements:
      toolchains:
        - python
    effects:
      writes:
        - .env.local
      network: true
      network_kind: tool_bootstrap
agent:
  protected_paths:
    - .env.local
