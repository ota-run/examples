version: 1
project:
  name: integration-test-effect
  description: Focused example for live or staging-backed verification with first-class integration_test effect truth
env:
  vars:
    STAGING_API_TOKEN:
      required: false
tasks:
  test:live:
    description: Run the staging-backed integration suite
    command:
      exe: npm
      args:
        - run
        - test:live
    requirements:
      env:
        - STAGING_API_TOKEN
    effects:
      network: true
      network_kind: integration_test
      external_state:
        - cloudflare
    notes: |
      Use this when the verification lane depends on a real remote system rather than local mocks.
agent:
  entrypoint: test:live
  default_task: test:live
  safe_tasks: []
  verify_after_changes: []
  writable_paths:
    - tests
  protected_paths:
    - ota.yaml
