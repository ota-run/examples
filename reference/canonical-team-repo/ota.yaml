version: 1
project:
  name: canonical-team-repo
  description: Advanced Ota example for a serious repo knowledge and workflow system
runtimes:
  node: "22"
tools:
  pnpm:
    version: "10"
    acquisition:
      provider: corepack
      package: pnpm
      version: "10.0.0"
  pwsh:
    version: "7.6.0"
    required: false
    only_on:
      - windows
env:
  vars:
    DOCS_SITE_BASE_URL:
      required: true
    RELEASE_CHANNEL:
      default: stable
      allowed:
        - stable
        - canary
    PATH:
      prepend:
        - ./node_modules/.bin
  sources:
    - kind: dotenv
      path: .env.local
    - kind: dotenv
      path: .env.ota-example
      must_exist: true
surfaces:
  docs:
    kind: http
    label: Docs Preview
    purpose: Browser-facing preview surface for the docs workflow
    visibility: public
    port: 4173
    path: /
    readiness:
      kind: http
      path: /health
      timeout: 5s
readiness:
  probes:
    docs-preview-ready:
      kind: http
      target:
        kind: task
        name: docs:preview
        listener: docs
        address_view: host
      path: /health
      timeout: 5000
tasks:
  setup:
    run: pnpm install
    requirements:
      tools:
        pnpm: "10"
  test:
    run: pnpm test
    depends_on:
      - setup
    requirements:
      tools:
        pnpm: "10"
  docs:check:
    run: pnpm run docs:check
    depends_on:
      - setup
    requirements:
      tools:
        pnpm: "10"
  docs:preview:
    run: pnpm run docs:preview --host 127.0.0.1 --port 4173
    depends_on:
      - setup
    requirements:
      tools:
        pnpm: "10"
    runtime:
      kind: service
      surfaces:
        - docs
  release:
    run: pnpm run release
    depends_on:
      - test
    requirements:
      tools:
        pnpm: "10"
      env:
        - DOCS_SITE_BASE_URL
    notes: |
      Run this only after `test` and `docs:check` are green.
      Keep `DOCS_SITE_BASE_URL` explicit on the release path instead of assuming it exists everywhere.
      Keep release notes and operating guidance in sync with the repo docs.
workflows:
  default: docs
  docs:
    intent: local_development
    description: Canonical docs authoring and preview path
    setup:
      task: setup
    run:
      task: docs:preview
    readiness:
      surfaces:
        - docs
    exposes:
      - surface: docs
  release:
    description: Release preparation path after docs and validation are green
    setup:
      task: setup
    run:
      task: release
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
  - name: docs-preview-ready
    kind: health
    severity: warn
    probe: docs-preview-ready
agent:
  entrypoint: setup
  default_task: docs:check
  safe_tasks:
    - setup
    - test
    - docs:check
    - docs:preview
  verify_after_changes:
    - test
    - docs:check
  writable_paths:
    - docs
    - src
    - tests
  protected_paths:
    - ota.yaml
    - docs/decision-log.md
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | sh
      powershell: irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way pnpm is the default package workflow in a Node service.
    Start with `ota doctor`, then `ota validate`, then `ota workflows`, then `ota proof runtime --workflow docs`.
    Use the docs in `docs/` as the repo's operational source of truth.
