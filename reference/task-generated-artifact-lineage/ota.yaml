version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: task-generated-artifact-lineage
  description: Canonical generated source producer and consumer lineage
  type: library

artifacts:
  typescript-sdk:
    kind: generated_source
    producer: sdk:generate
    paths:
      - sdk/typescript/src/api/client.gen.ts
    inputs:
      - schema/api.graphql

tasks:
  sdk:generate:
    description: Generate the typed SDK source from the API schema
    category: setup
    command:
      exe: api-generator
      args:
        - generate
        - typescript
    effects:
      writes:
        - sdk/typescript/src/api/client.gen.ts

  sdk:verify:
    description: Verify the generated TypeScript SDK after its producer materializes it
    category: test
    replay_inputs:
      - id: api_schema
        kind: static_file
        path: schema/api.graphql
      - id: runtime-presentation
        kind: presentation_profile
        path: replay/presentation-profile.yaml
      - id: equivalence
        kind: comparator_profile
        path: replay/comparator-profile.yaml
    witnessed_observations:
      query_traces:
        - id: recorded_queries
          path: evidence/sdk-queries.jsonl
    command:
      exe: npm
      args:
        - run
        - test:sdk
    depends_on:
      - sdk:generate
    requires_artifacts:
      - typescript-sdk
