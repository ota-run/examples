version: 1
project:
  name: task-prepare-dependency-hydration
  description: Reference contract showing first-class task preparation for docker-backed image hydration
  type: application

tasks:
  setup:docker:images:
    description: Pre-pull registry-backed docker dependencies before startup
    category: setup
    prepare:
      kind: dependency_hydration
      medium: container_images
      source:
        kind: docker_compose
        cwd: docker
        files:
          - docker-compose.base.yml
          - docker-compose.dev.yml
        env_files:
          - .env.compose
      targets:
        - redis
        - database
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: container_image_hydration
      external_state:
        - docker

  services:up:
    description: Start the local stack after external images are hydrated
    category: setup
    depends_on:
      - setup:docker:images
    adapter_inputs:
      compose:
        cwd: docker
        files:
          - docker/docker-compose.dev.yml
    command:
      exe: docker
      args:
        - compose
        - up
        - -d
        - redis
        - database
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
