version: 1
metadata:
  ota:
    minimum_version: "1.6.26"

project:
  name: action-ensure-container-network
  description: Focused public example for deterministic Docker network bootstrap
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
tasks:
  network:ensure:
    context: host
    description: Ensure the shared external Docker network exists before compose workloads attach
    action:
      kind: ensure_container_network
      name: penpot_shared
    requirements:
      tools:
        docker: "*"
workflows:
  default: local-network
  local-network:
    prepare:
      task: network:ensure
