version: 1
project:
  name: action-reset-compose-service-volume
  description: Focused public example for deterministic Compose-managed service volume reset
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
tasks:
  postgres:reset:
    context: host
    description: Reset the local Postgres data volume and restart the Compose-managed service
    notes: Use this when a fresh local Postgres state is the truthful owner boundary.
    action:
      kind: reset_compose_service_volume
      service: postgres
      volume: app_postgres-data
      compose:
        cwd: docker
        files:
          - docker/docker-compose.yml
        project_name: app
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
workflows:
  default: local-reset
  local-reset:
    prepare:
      task: postgres:reset
metadata:
  ota:
    minimum_version: "1.6.22"
