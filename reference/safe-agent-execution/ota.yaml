version: 1

project:
  name: safe-agent-execution
  description: Runner-enforced safe closure with a real refusal canary

tasks:
  verify:
    description: Run the routine agent-safe verification lane
    command:
      exe: ota
      args:
        - --version
    safe_for_agent: true

  publish:
    description: Represent a heavier lane that must remain unavailable to agents
    command:
      exe: ota
      args:
        - --version
    safe_for_agent: false

agent:
  default_task: verify
  safe_tasks:
    - verify
  refusal_canaries:
    - task: publish
  verify_after_changes:
    - verify
  writable_paths: []
  protected_paths:
    - ota.yaml
