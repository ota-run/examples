version: 1
project:
  name: action-build-container-image
  description: Focused public example for Dockerfile-backed local image materialization
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
tasks:
  image:build:
    context: host
    description: Build the local image consumed by the declared container verification lane
    action:
      kind: build_container_image
      file: Dockerfile
      context: .
      tag: action-build-container-image:local
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: broad
      external_state:
        - docker
