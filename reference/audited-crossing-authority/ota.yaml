version: 1

project:
  name: audited-crossing-authority
  description: Exact signed authority for a heavier non-agent execution closure

metadata:
  ota:
    minimum_version: "1.6.26"

governance:
  crossing_authority:
    authority_id: platform-release-authority

tasks:
  verify:
    description: Run routine verification without crossing authority
    command:
      exe: sh
      args:
        - -c
        - printf verified
    safe_for_agent: true

  publish:
    description: Demonstrate a heavier lane that requires exact signed authority
    command:
      exe: sh
      args:
        - -c
        - printf publish
    safe_for_agent: false

agent:
  safe_tasks:
    - verify
  writable_paths: []
  protected_paths:
    - ota.yaml
  verify_after_changes:
    - verify
