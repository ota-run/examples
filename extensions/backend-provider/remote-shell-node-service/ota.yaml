version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: remote-shell-node-service
  description: Node service example that uses a custom remote backend provider
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
execution:
  default_context: app
  contexts:
    app:
      backend: remote
      lifecycle: persistent
      remote:
        provider: remote-shell
        target: sandbox-dev
        cwd: /workspace
extensions:
  remote-shell:
    kind: backend_provider
    command: ota-ext-remote-shell
    api_version: 1
    description: Custom remote execution backend
    config:
      transport: ssh
      workspace_root: /workspace
tasks:
  setup:
    context: app
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
      network: true
      network_kind: dependency_hydration
    notes: |
      Example: `ota run setup` to prepare the repo on the custom remote context.
  dev:
    context: app
    run: pnpm dev
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run dev` while iterating on the remote context.
  test:
    context: app
    command:
      exe: pnpm
      args:
        - test
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run test` before merging from the remote context.
agent:
  entrypoint: setup
  default_task: test
  safe_tasks:
    - setup
    - dev
    - test
  verify_after_changes:
    - test
  writable_paths:
    - node_modules
    - src
    - tests
    - docs
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Use Ota first for setup, validation, and task execution.
    Treat Ota as the default workflow when the repo uses a custom remote backend.
    Start with `ota doctor`, then `ota validate`, then `ota tasks`.
    Keep the backend name, target, and execution intent explicit.
