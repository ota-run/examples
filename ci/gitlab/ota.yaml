version: 1
project:
  name: gitlab-readiness-gate
  description: GitLab CI readiness gate example with plain annotations and archived receipts
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    description: Hydrate workspace dependencies through the declared pnpm lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
  ci:
    run: pnpm run ci
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: ci
  safe_tasks:
    - setup
    - ci
  verify_after_changes:
    - ci
  writable_paths:
    - node_modules
    - .pnpm-store
    - src
    - .gitlab-ci.yml
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      sh: curl -fsSL https://dist.ota.run/install.sh | OTA_VERSION=v1.6.20 sh
      powershell: $env:OTA_VERSION='v1.6.20'; irm https://dist.ota.run/install.ps1 | iex
  notes: |
    Keep the readiness gate read-only and use `ota doctor --json` for feedback plus
    `ota receipt --json --archive` for durable artifacts.
    Run direct `ota run setup` and `ota run ci` only after the readiness gate is clear.
