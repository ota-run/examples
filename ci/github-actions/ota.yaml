version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: github-actions-ci
  description: GitHub Actions release example driven by ota orchestration
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    description: Hydrate workspace dependencies through the declared pnpm lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
  ci:
    command:
      exe: pnpm
      args:
        - run
        - ci
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
  version:bump:
    inputs:
      version:
        description: Release bump target
        default: patch
    command:
      exe: node
      args:
        - scripts/bump-version.mjs
    requirements:
      toolchains:
        - node
    notes: |
      Example: `ota run version:bump . --version patch`
      Use `patch` for routine releases.
      Use `minor`, `major`, `prerelease`, or an explicit semver when needed.
  release:
    command:
      exe: pnpm
      args:
        - run
        - release
    depends_on:
      - ci
    requirements:
      toolchains:
        - node
    notes: |
      Run this after CI is green and the version bump task has been applied.
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: release
  safe_tasks:
    - setup
    - ci
    - version:bump
  verify_after_changes:
    - ci
  writable_paths:
    - node_modules
    - .pnpm-store
    - src
    - scripts
    - .github/workflows
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way GitHub Actions is the default runner for CI.
    Start with `ota doctor`, then `ota validate`, then `ota tasks`.
    Use `ota run setup` before `ota run ci`.
    Use `ota run release` only after CI is green.
