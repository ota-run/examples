version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: github-actions-matrix-tests
  description: GitHub Actions matrix example with Ota-owned repo truth
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    description: Hydrate workspace dependencies through the declared pnpm lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
    notes: |
      Run this before either matrix target.
  test:web:
    command:
      exe: pnpm
      args:
        - run
        - test:web
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Use this for the web split.
  test:api:
    command:
      exe: pnpm
      args:
        - run
        - test:api
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      Use this for the API split.
  ci:
    command:
      exe: pnpm
      args:
        - run
        - ci
    depends_on:
      - test:web
      - test:api
    requirements:
      toolchains:
        - node
    notes: |
      Use this after both matrix targets pass.
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: ci
  safe_tasks:
    - setup
    - test:web
    - test:api
  verify_after_changes:
    - test:web
    - test:api
  writable_paths:
    - node_modules
    - .pnpm-store
    - src
    - tests
    - .github/workflows
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Use the Ota workflow first for setup, validation, and task execution.
    Treat Ota as the default workflow for this repo, the way GitHub Actions is the default runner for CI fan-out.
    Start with `ota doctor`, then `ota validate`, then `ota tasks`.
