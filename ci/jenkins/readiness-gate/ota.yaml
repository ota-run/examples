version: 1
metadata:
  ota:
    minimum_version: "1.6.23"

project:
  name: jenkins-readiness-gate
  description: Jenkins readiness gate example with plain annotations and archived receipts
toolchains:
  node:
    version: "22"
    package_managers:
      pnpm: "10.0.0"
    fulfillment:
      source: corepack
      mode: run
tasks:
  setup:
    description: Hydrate workspace dependencies through the declared pnpm lane
    prepare:
      kind: dependency_hydration
      medium: package_dependencies
      source:
        kind: node_package_manager
        cwd: .
        manager: pnpm
        mode: install
        frozen_lockfile: true
    requirements:
      toolchains:
        - node
    effects:
      writes:
        - node_modules
        - .pnpm-store
      network: true
      network_kind: dependency_hydration
  ci:
    command:
      exe: pnpm
      args:
        - run
        - ci
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
checks:
  - name: node-installed
    kind: precondition
    severity: error
    run: node --version
agent:
  entrypoint: setup
  default_task: ci
  safe_tasks:
    - setup
    - ci
  verify_after_changes:
    - ci
  writable_paths:
    - node_modules
    - .pnpm-store
    - src
    - Jenkinsfile
  protected_paths:
    - ota.yaml
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: version
        version: v1.6.23
  notes: |
    Capture readiness first, archive `.ota/ci/**` and `.ota/receipts/**`, then block setup and CI
    when the readiness gate reports errors.
